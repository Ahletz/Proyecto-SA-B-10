spring:
  datasource:
    url: jdbc:postgresql://${CUSTOMER_DB_HOST:${DB_HOST:localhost}}:${CUSTOMER_DB_PORT:${DB_PORT:5433}}/${CUSTOMER_DB_NAME:${DB_DATABASE:bank_customer}}
    username: ${CUSTOMER_DB_USER:${DB_USERNAME:customer_user}}
    password: ${CUSTOMER_DB_PASSWORD:${DB_PASSWORD:customer_password}}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:rabbit_user}
    password: ${RABBITMQ_DEFAULT_PASS:rabbit_password}

server:
  port: 8081
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:default-secret-change-me}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
