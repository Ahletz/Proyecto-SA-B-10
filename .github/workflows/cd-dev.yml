name: CD - Deploy dev

# Merge a develop: construye y publica las imágenes (tag sha-<commit>) en GHCR
# y las despliega en el namespace `dev` de un cluster kind efímero, donde corre
# el smoke test end-to-end (reusable-kind-smoke.yml). Las bases de datos corren
# FUERA del cluster, igual que en scripts/project/start-k8s.sh.

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-dev
  cancel-in-progress: false

jobs:
  images:
    name: Build image - ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prefix: ${{ steps.meta.outputs.prefix }}

    strategy:
      fail-fast: true
      matrix:
        service:
          - customer-service
          - account-service
          - transaction-service
          - payment-service
          - notification-audit-service
          - api-gateway
          - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Image metadata
        id: meta
        run: |
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bank-usac" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.prefix }}/${{ matrix.service }}:${{ steps.meta.outputs.tag }}
          build-args: |
            VITE_API_BASE_URL=http://localhost:30080
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-dev:
    name: Deploy dev
    needs: images
    uses: ./.github/workflows/reusable-kind-smoke.yml
    with:
      prefix: ${{ needs.images.outputs.prefix }}
      tag: ${{ needs.images.outputs.tag }}
