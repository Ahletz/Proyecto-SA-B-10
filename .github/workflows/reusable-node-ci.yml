name: Reusable - Node service CI

# Build + test (+ lint opcional) de un microservicio Node/NestJS.
# Cualquier integrante puede llamarlo desde su workflow:
#
#   jobs:
#     mi-servicio:
#       uses: ./.github/workflows/reusable-node-ci.yml
#       with:
#         service: account-service
#         lint: false

on:
  workflow_call:
    inputs:
      service:
        description: Carpeta del servicio dentro de apps/
        required: true
        type: string
      lint:
        description: Ejecutar `npm run lint`
        required: false
        type: boolean
        default: false
      test:
        description: Ejecutar `npm test`
        required: false
        type: boolean
        default: true
      docker:
        description: Verificar que la imagen Docker construye (solo en push)
        required: false
        type: boolean
        default: true

jobs:
  build-test:
    name: ${{ inputs.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/${{ inputs.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/${{ inputs.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        if: inputs.lint
        run: npm run lint

      - name: Test
        if: inputs.test
        run: npm test

      - name: Build
        run: npm run build

      - name: Docker sanity check
        if: inputs.docker && github.event_name == 'push'
        run: docker build -t bank-usac/${{ inputs.service }}:ci .
