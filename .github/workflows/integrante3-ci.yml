name: Integrante 3 CI

on:
  push:
    branches:
      - 'feature/**'
    paths:
      - 'apps/transaction-service/**'
      - 'apps/api-gateway/**'
      - 'k8s/**'
      - '.github/workflows/integrante3-ci.yml'
      - '.github/workflows/reusable-node-ci.yml'

  pull_request:
    branches:
      - develop
    paths:
      - 'apps/transaction-service/**'
      - 'apps/api-gateway/**'
      - 'k8s/**'
      - '.github/workflows/integrante3-ci.yml'
      - '.github/workflows/reusable-node-ci.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: integrante3-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build selectivo: cada job corre solo si cambió su carpeta (o este workflow).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      transaction-service: ${{ steps.filter.outputs.transaction-service }}
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      k8s: ${{ steps.filter.outputs.k8s }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changes per service
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: develop
          filters: |
            workflow: &workflow
              - '.github/workflows/integrante3-ci.yml'
              - '.github/workflows/reusable-node-ci.yml'
            transaction-service:
              - *workflow
              - 'apps/transaction-service/**'
            api-gateway:
              - *workflow
              - 'apps/api-gateway/**'
            k8s:
              - '.github/workflows/integrante3-ci.yml'
              - 'k8s/**'

  transaction-service:
    name: Transaction - Build and Test
    needs: changes
    if: needs.changes.outputs.transaction-service == 'true'
    uses: ./.github/workflows/reusable-node-ci.yml
    with:
      service: transaction-service
      lint: true

  api-gateway:
    name: API Gateway - Build and Test
    needs: changes
    if: needs.changes.outputs.api-gateway == 'true'
    uses: ./.github/workflows/reusable-node-ci.yml
    with:
      service: api-gateway

  k8s-manifests:
    name: Kubernetes - Validate manifests
    needs: changes
    if: needs.changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Render overlays
        run: |
          kubectl kustomize k8s/overlays/dev > rendered-dev.yaml
          kubectl kustomize k8s/overlays/prod > rendered-prod.yaml

      - name: Validate schemas (kubeconform)
        run: |
          for f in rendered-dev.yaml rendered-prod.yaml; do
            docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0 \
              -strict -summary - < "$f"
          done

      - name: Reject mutable image tags
        run: |
          if grep -nE 'image: .*:latest\b' rendered-dev.yaml rendered-prod.yaml; then
            echo "::error::No se permiten imágenes con tag latest"
            exit 1
          fi
