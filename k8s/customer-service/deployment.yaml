apiVersion: apps/v1
kind: Deployment
metadata: { name: customer-service, namespace: bank-usac }
spec:
  replicas: 1
  selector: { matchLabels: { app: customer-service } }
  template:
    metadata: { labels: { app: customer-service } }
    spec:
      containers:
        - name: customer-service
          image: bank-usac/customer-service:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8081}]
          env:
            - { name: DB_HOST, valueFrom: { configMapKeyRef: { name: bank-db-config, key: CUSTOMER_DB_HOST } } }
            - { name: DB_PORT, valueFrom: { configMapKeyRef: { name: bank-db-config, key: CUSTOMER_DB_PORT } } }
            - { name: DB_DATABASE, valueFrom: { configMapKeyRef: { name: bank-db-config, key: CUSTOMER_DB_NAME } } }
            - { name: DB_USERNAME, valueFrom: { secretKeyRef: { name: bank-db-secret, key: CUSTOMER_DB_USER } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: bank-db-secret, key: CUSTOMER_DB_PASSWORD } } }
            - { name: RABBITMQ_HOST, value: rabbitmq }
            - { name: RABBITMQ_PORT, value: "5672" }
            - { name: RABBITMQ_DEFAULT_USER, valueFrom: { secretKeyRef: { name: rabbitmq-secret, key: username } } }
            - { name: RABBITMQ_DEFAULT_PASS, valueFrom: { secretKeyRef: { name: rabbitmq-secret, key: password } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: bank-shared-secret, key: JWT_SECRET } } }
            - { name: SEED_DEMO_USERS, value: "true" }
            - { name: DEMO_ADMIN_PASSWORD, value: "Admin123!" }
            - { name: DEMO_CASHIER_PASSWORD, value: "Cashier123!" }
          readinessProbe: { httpGet: { path: /actuator/health, port: 8081 }, periodSeconds: 5, timeoutSeconds: 3 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8081 }, periodSeconds: 10, failureThreshold: 3 }
          # Hasta 180 s para que arranque Spring; mientras tanto no corren readiness ni liveness.
          startupProbe: { httpGet: { path: /actuator/health/liveness, port: 8081 }, periodSeconds: 5, failureThreshold: 36 }
---
apiVersion: v1
kind: Service
metadata: { name: customer-service, namespace: bank-usac }
spec: { selector: { app: customer-service }, ports: [{ port: 8081, targetPort: 8081 }] }
