# Servicios Spring Boot: la JVM dimensiona el heap según el límite del contenedor;
# con MaxRAMPercentage=70 el heap llega a ~537 MiB y queda margen para metaspace e hilos.
- op: add
  path: /spec/template/spec/containers/0/resources
  value:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { cpu: 500m, memory: 768Mi }
- op: add
  path: /spec/template/spec/containers/0/env/-
  value: { name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=70" }
