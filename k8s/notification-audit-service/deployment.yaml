apiVersion: apps/v1
kind: Deployment
metadata: { name: notification-audit-service, namespace: bank-usac }
spec:
  replicas: 1
  selector: { matchLabels: { app: notification-audit-service } }
  template:
    metadata: { labels: { app: notification-audit-service } }
    spec:
      containers:
        - name: notification-audit-service
          image: bank-usac/notification-audit-service:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8082 }]
          env:
            - { name: DB_HOST, valueFrom: { configMapKeyRef: { name: bank-db-config, key: NOTIF_DB_HOST } } }
            - { name: DB_PORT, valueFrom: { configMapKeyRef: { name: bank-db-config, key: NOTIF_DB_PORT } } }
            - { name: DB_DATABASE, valueFrom: { configMapKeyRef: { name: bank-db-config, key: NOTIF_DB_NAME } } }
            - { name: DB_USERNAME, valueFrom: { secretKeyRef: { name: bank-db-secret, key: NOTIF_DB_USER } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: bank-db-secret, key: NOTIF_DB_PASSWORD } } }
            - { name: RABBITMQ_HOST, value: rabbitmq }
            - { name: RABBITMQ_PORT, value: "5672" }
            - { name: RABBITMQ_DEFAULT_USER, valueFrom: { secretKeyRef: { name: rabbitmq-secret, key: username } } }
            - { name: RABBITMQ_DEFAULT_PASS, valueFrom: { secretKeyRef: { name: rabbitmq-secret, key: password } } }
            - { name: SMTP_HOST, value: mailhog }
            - { name: SMTP_PORT, value: "1025" }
            - { name: FRONTEND_URL, value: "http://localhost:30000" }
          readinessProbe: { httpGet: { path: /actuator/health, port: 8082 }, periodSeconds: 5, timeoutSeconds: 3 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8082 }, periodSeconds: 10, failureThreshold: 3 }
          # Hasta 180 s para que arranque Spring; mientras tanto no corren readiness ni liveness.
          startupProbe: { httpGet: { path: /actuator/health/liveness, port: 8082 }, periodSeconds: 5, failureThreshold: 36 }
---
apiVersion: v1
kind: Service
metadata: { name: notification-audit-service, namespace: bank-usac }
spec: { selector: { app: notification-audit-service }, ports: [{ port: 8082, targetPort: 8082 }] }
