apiVersion: apps/v1
kind: Deployment
metadata: { name: transaction-service, namespace: bank-usac }
spec:
  replicas: 1
  selector: { matchLabels: { app: transaction-service } }
  template:
    metadata: { labels: { app: transaction-service } }
    spec:
      containers:
        - name: transaction-service
          image: bank-usac/transaction-service:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 3003}]
          env:
            - { name: PORT, value: "3003" }
            - { name: DB_HOST, value: "__HOST_GATEWAY__" }
            - { name: DB_PORT, value: "5434" }
            - { name: DB_DATABASE, value: "bank_transaction" }
            - { name: DB_USERNAME, value: "transaction_user" }
            - { name: DB_PASSWORD, value: "transaction_password" }
            - { name: DB_SYNCHRONIZE, value: "true" }
            - { name: RABBITMQ_URL, valueFrom: { secretKeyRef: { name: bank-shared-secret, key: RABBITMQ_URL } } }
            - { name: RABBITMQ_EXCHANGE, value: "bank.events" }
            - { name: RABBITMQ_QUEUE, value: "transaction-service.events" }
            - { name: RABBITMQ_RETRY_EXCHANGE, value: "bank.events.retry" }
            - { name: RABBITMQ_DLX, value: "bank.events.dlx" }
          readinessProbe:
            tcpSocket: { port: 3003 }
            initialDelaySeconds: 8
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: transaction-service, namespace: bank-usac }
spec: { selector: { app: transaction-service }, ports: [{port: 3003,targetPort: 3003}] }
