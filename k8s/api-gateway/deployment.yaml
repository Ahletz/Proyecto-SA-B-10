apiVersion: apps/v1
kind: Deployment
metadata: { name: api-gateway, namespace: bank-usac }
spec:
  replicas: 1
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: api-gateway
          image: bank-usac/api-gateway:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - { name: PORT, value: "8080" }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: bank-shared-secret, key: JWT_SECRET } } }
            - { name: RABBITMQ_URL, valueFrom: { secretKeyRef: { name: bank-shared-secret, key: RABBITMQ_URL } } }
            - { name: CUSTOMER_SERVICE_URL, value: "http://customer-service:8081" }
            - { name: ACCOUNT_SERVICE_URL, value: "http://account-service:3004" }
            - { name: TRANSACTION_SERVICE_URL, value: "http://transaction-service:3003" }
            - { name: PAYMENT_SERVICE_URL, value: "http://payment-service:3005" }
            - { name: NOTIFICATION_SERVICE_URL, value: "http://notification-audit-service:8082" }
          readinessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 5, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway, namespace: bank-usac }
spec: { type: NodePort, selector: { app: api-gateway }, ports: [{ port: 8080, targetPort: 8080, nodePort: 30080 }] }
