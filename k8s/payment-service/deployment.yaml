apiVersion: apps/v1
kind: Deployment
metadata: { name: payment-service, namespace: bank-usac }
spec:
  replicas: 1
  selector: { matchLabels: { app: payment-service } }
  template:
    metadata: { labels: { app: payment-service } }
    spec:
      containers:
        - name: payment-service
          image: bank-usac/payment-service:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 3005}]
          env:
            - { name: PORT, value: "3005" }
            - { name: DB_HOST, value: "__HOST_GATEWAY__" }
            - { name: DB_PORT, value: "5437" }
            - { name: DB_DATABASE, value: "bank_payment" }
            - { name: DB_USERNAME, value: "payment_user" }
            - { name: DB_PASSWORD, value: "payment_password" }
            - { name: DB_SYNCHRONIZE, value: "true" }
            - { name: RABBITMQ_URL, valueFrom: { secretKeyRef: { name: bank-shared-secret, key: RABBITMQ_URL } } }
            - { name: RABBITMQ_QUEUE, value: "payment-service.events" }
            - { name: PAYMENT_MAX_AMOUNT, value: "1000000" }
          readinessProbe:
            tcpSocket: { port: 3005 }
            initialDelaySeconds: 8
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: payment-service, namespace: bank-usac }
spec: { selector: { app: payment-service }, ports: [{port: 3005,targetPort: 3005}] }
