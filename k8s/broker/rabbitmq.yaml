apiVersion: v1
kind: Secret
metadata: { name: rabbitmq-secret, namespace: bank-usac }
type: Opaque
stringData: { username: rabbit_user, password: rabbit_password }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: rabbitmq, namespace: bank-usac }
spec:
  replicas: 1
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq } }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4.3.6-management
          ports: [{containerPort: 5672},{containerPort: 15672}]
          env:
            - { name: RABBITMQ_DEFAULT_USER, valueFrom: { secretKeyRef: { name: rabbitmq-secret, key: username } } }
            - { name: RABBITMQ_DEFAULT_PASS, valueFrom: { secretKeyRef: { name: rabbitmq-secret, key: password } } }
          # ~218 MiB en uso; la alarma de memoria de RabbitMQ salta al 40 % del límite, por eso 1Gi.
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 1Gi } }
          # Probe TCP al puerto AMQP: `rabbitmq-diagnostics ping` arranca una VM de Erlang y con el límite
          # de 500m de CPU tarda más de 1 s (timeout de la probe), así que RabbitMQ nunca quedaba Ready.
          readinessProbe: { tcpSocket: { port: 5672 }, initialDelaySeconds: 10, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq, namespace: bank-usac }
spec: { selector: { app: rabbitmq }, ports: [{name: amqp,port: 5672,targetPort: 5672},{name: management,port: 15672,targetPort: 15672}] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mailhog, namespace: bank-usac }
spec:
  replicas: 1
  selector: { matchLabels: { app: mailhog } }
  template:
    metadata: { labels: { app: mailhog } }
    spec: { containers: [{ name: mailhog, image: mailhog/mailhog:v1.0.1, ports: [{ containerPort: 1025 }, { containerPort: 8025 }],
      resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { cpu: 100m, memory: 64Mi } } }] }
---
apiVersion: v1
kind: Service
metadata: { name: mailhog, namespace: bank-usac }
spec: { selector: { app: mailhog }, ports: [{ name: smtp, port: 1025, targetPort: 1025 }, { name: web, port: 8025, targetPort: 8025 }] }
