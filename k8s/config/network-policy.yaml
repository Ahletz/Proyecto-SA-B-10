apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: backend-ingress-policy, namespace: bank-usac }
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [customer-service,account-service,transaction-service,payment-service,notification-audit-service] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: api-gateway } }
        - podSelector: { matchLabels: { app: rabbitmq } }

---
# Allow only the observability Alertmanager to call Notification's internal webhook.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: notification-alertmanager-ingress, namespace: bank-usac}
spec:
  podSelector:
    matchLabels: {app: notification-audit-service}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
          podSelector:
            matchLabels: {app: alertmanager}
      ports: [{protocol: TCP, port: 8082}]
