# Credenciales de las bases de datos (sección 2.4 del plan). Valores de desarrollo,
# iguales a infrastructure/docker-compose.yml; el overlay prod los reemplaza.
apiVersion: v1
kind: Secret
metadata: { name: bank-db-secret, namespace: bank-usac }
type: Opaque
stringData:
  CUSTOMER_DB_USER: customer_user
  CUSTOMER_DB_PASSWORD: customer_password
  ACCOUNT_DB_USER: account_user
  ACCOUNT_DB_PASSWORD: account_password
  TRANSACTION_DB_USER: transaction_user
  TRANSACTION_DB_PASSWORD: transaction_password
  PAYMENT_DB_USER: payment_user
  PAYMENT_DB_PASSWORD: payment_password
  NOTIF_DB_USER: notification_user
  NOTIF_DB_PASSWORD: notification_password
