apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

resources:
  - k8s/namespace.yaml
  - k8s/otel-collector.yaml
  - k8s/otel-logs-agent.yaml
  - k8s/prometheus.yaml
  - k8s/alertmanager.yaml
  - k8s/kube-state-metrics.yaml
  - k8s/tempo.yaml
  - k8s/loki.yaml
  - k8s/grafana.yaml

# Dashboards y alertas como código: cada archivo nuevo se agrega aquí.
configMapGenerator:
  - name: grafana-dashboards
    files:
      - dashboards/bank-overview.json
      - dashboards/bank-slo.json
      - dashboards/bank-infra.json
      - dashboards/bank-transactions.json
    options:
      disableNameSuffixHash: true
  - name: prometheus-rules
    files:
      - alerts/stack-alerts.yaml
      - alerts/slo-alerts.yaml
    options:
      disableNameSuffixHash: true
